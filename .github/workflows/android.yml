name: Compilar MintFetch Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet (Motor UI)
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Preparar Ícono Oficial
        run: |
          mkdir assets
          mv icon.png assets/

      - name: Compilar a APK (La Magia de Android)
        run: yes | flet build apk

      - name: Subir APK Terminado
        uses: actions/upload-artifact@v4
        with:
          name: MintFetch-Android
          path: build/apk/
